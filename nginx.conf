server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver embutido do Docker (127.0.0.11) + upstream como variável: força
    # o nginx a resolver api-gateway/notification-service por requisição, não
    # uma vez só na subida do worker. Sem isso, se o nginx iniciar antes do
    # nome do serviço estar resolvível na rede Docker (comum em "docker
    # compose up" com todos os serviços de uma vez), ele crasha com "host not
    # found in upstream" e fica parado pra sempre (sem restart policy, ninguém
    # tenta de novo).
    resolver 127.0.0.11 valid=10s;

    # Serve SPA — roteamento no cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para API Gateway
    location /api/ {
        set $upstream_gateway api-gateway:8080;
        proxy_pass http://$upstream_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket para notification-service
    location /ws {
        set $upstream_notification notification-service:8085;
        proxy_pass http://$upstream_notification;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Service worker e seu registrador: nomes fixos (sem hash), então o
    # navegador precisa revalidar a cada carregamento — senão o autoUpdate do
    # PWA nunca percebe uma build nova (ficou preso em cache "immutable" de 1
    # ano e nenhuma tela nova chega pro usuário até o cache expirar sozinho).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # Cache para assets estáticos (nomes com hash de conteúdo — o workbox-*.js
    # também cai aqui, e pode: só é referenciado pelo sw.js acima, que não é
    # mais cacheado de forma imutável)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
